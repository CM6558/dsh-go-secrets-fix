# Fast check for the secret-storage change, with no runtime bundle and no APK.
#
# The full build (`.github/workflows/build.yml`) spends most of its time on the
# bundled Linux runtime, which this change does not touch. This workflow answers
# the only questions the change raises — does it analyze, do the tests pass —
# in a few minutes, so a review doesn't wait an hour for an APK it can't use yet.
#
# Run it from the Actions tab (workflow_dispatch) or let it run on a PR.

name: secrets-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/lib/remote/**'
      - 'app/lib/state/hosts_state.dart'
      - 'app/lib/state/provider_keys.dart'
      - 'app/lib/state/settings_state.dart'
      - 'app/lib/forum/forum_auth.dart'
      - 'app/lib/share_hosted/hosted_links_state.dart'
      - 'app/test/remote/**'
      - '.github/workflows/secrets-check.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The widget tests load Noto Sans CJK from /usr/share/fonts/noto-cjk
      # (app/test/support/test_fonts.dart). Runner images don't ship it, and a
      # missing font fails the whole suite at load time.
      # Ubuntu's fonts-noto-cjk installs into opentype/noto, not the
      # /usr/share/fonts/noto-cjk the harness defaults to; point it there and
      # check the three faces it asks for are really present.
      - name: test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dir=/usr/share/fonts/opentype/noto
          ls -la "$dir" | head
          for f in NotoSansCJK-Light.ttc NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc; do
            test -f "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
          done
          echo "DSH_TEST_FONT_DIR=$dir" >> "$GITHUB_ENV"

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: analyze
        working-directory: app
        run: flutter analyze

      # The secret-storage tests are the point of this workflow; run them on
      # their own first so a failure is unambiguous in the log.
      - name: secret storage tests
        working-directory: app
        run: |
          flutter test \
            test/remote/secret_store_test.dart \
            test/remote/hosts_state_test.dart \
            test/remote/ssh_key_decode_test.dart \
            --reporter expanded

      - name: all tests
        working-directory: app
        run: flutter test

      # Catches a locale key that exists in the parts but not in the generated
      # class (this change adds four, and gen-l10n needs Flutter to run).
      - name: l10n is in sync
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
